name: Build Jarvis.exe

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-linux:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System audio headers for PyAudio
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
        env:
          SDL_AUDIODRIVER: dummy

  build-windows:
    name: Build Jarvis.exe (Windows)
    runs-on: windows-latest
    permissions:
      contents: write # only used to attach the exe to a release on v* tags
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - name: Test, build and self-test the executable
        run: python build.py
        env:
          JARVIS_BUILD_NUMBER: ${{ github.run_number }}
          SDL_AUDIODRIVER: dummy
          PYTHONIOENCODING: utf-8
      - name: GUI smoke test (launch the real exe and wait for the HUD)
        shell: pwsh
        env:
          JARVIS_HOME: ${{ runner.temp }}\jarvis-home
        run: |
          New-Item -ItemType Directory -Force $env:JARVIS_HOME | Out-Null
          $p = Start-Process -FilePath dist\Jarvis.exe -ArgumentList '--smoke-test','--smoke-report','smoke.json','--smoke-hold','12' -PassThru
          $null = $p.Handle  # keeps ExitCode readable after the process ends
          $deadline = (Get-Date).AddSeconds(240)
          while (-not (Test-Path smoke.json) -and -not $p.HasExited -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 1 }
          Start-Sleep -Seconds 3
          python -c "from PIL import ImageGrab; ImageGrab.grab(all_screens=True).save('smoke.png')"
          if (-not $p.WaitForExit(120000)) { Stop-Process -Id $p.Id -Force; Write-Host 'Jarvis.exe did not exit in time' }
          Write-Host "Jarvis.exe exit code: $($p.ExitCode)"
          if (Test-Path smoke.json) { Get-Content smoke.json } else { Write-Host 'No smoke report was written' }
          Write-Host '----- jarvis.log -----'
          Get-Content "$env:JARVIS_HOME\jarvis.log" -ErrorAction SilentlyContinue
          Get-Content "$env:TEMP\jarvis-crash.txt" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Window check (real mouse and keyboard - drag, resize, maximise, full screen, minimise, close)
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: python tests/windows_window_check.py dist/Jarvis.exe window-check.json
      - name: One-click update check (real exe - download, verify, self-test, swap, restart; and roll back a broken one)
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: python tests/windows_update_check.py dist/Jarvis.exe update-check.json
      - name: Native crash reporting check (a .NET thread crash must be reported, not silent)
        shell: pwsh
        env:
          JARVIS_HOME: ${{ runner.temp }}\jarvis-home
          JARVIS_NO_DIALOGS: "1"
        run: |
          $crashFile = Join-Path $env:TEMP 'jarvis-crash.txt'
          Remove-Item $crashFile -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath dist\Jarvis.exe -ArgumentList '--diag-dotnet-crash' -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(120000)) { Stop-Process -Id $p.Id -Force }
          Write-Host ("Jarvis.exe exit code: 0x{0:X8}" -f $p.ExitCode)
          $report = Get-Content $crashFile -Raw -ErrorAction SilentlyContinue
          Write-Host $report
          if ($report -notmatch 'diagnostic \.NET crash test') { Write-Error 'The .NET crash handler did not report the crash'; exit 1 }
      - name: Make sure Windows OCR has a language (installs the en-US OCR pack if missing)
        shell: powershell  # Windows PowerShell 5.1: PowerShell 7 can't load WinRT types (JARVIS's helper uses 5.1 too)
        continue-on-error: true
        timeout-minutes: 10
        run: |
          $null = [Windows.Media.Ocr.OcrEngine, Windows.Foundation, ContentType = WindowsRuntime]
          $langs = [Windows.Media.Ocr.OcrEngine]::AvailableRecognizerLanguages
          Write-Host "OCR languages: $(($langs | ForEach-Object { $_.LanguageTag }) -join ', ')"
          if (-not $langs -or $langs.Count -eq 0) {
            Get-WindowsCapability -Online | Where-Object Name -like 'Language.OCR*' | Select-Object Name, State | Format-Table
            Add-WindowsCapability -Online -Name 'Language.OCR~~~en-US~0.0.1.0'
          }
      - name: Vision functional check (real desktop - capture, OCR, find, click, type)
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: python tests/windows_vision_check.py vision-check.json vision-check.png
      - name: Browser tab check (real Chrome - close a tab by name, reopen, close the active tab, close Chrome)
        shell: pwsh
        timeout-minutes: 5
        env:
          PYTHONIOENCODING: utf-8
        run: python tests/windows_tabs_check.py tabs-check.json
      - name: Typing check (real app - JARVIS types a generated pizza recipe and exact words)
        shell: pwsh
        timeout-minutes: 5
        env:
          PYTHONIOENCODING: utf-8
        run: python tests/windows_typing_check.py typing-check.json
      - name: Online services check (real weather from Open-Meteo, Google speech with no words)
        shell: pwsh
        timeout-minutes: 5
        env:
          PYTHONIOENCODING: utf-8
        run: python tests/windows_online_check.py online-check.json
      - name: Wake-word check (learn "Hey Harper" / "Hey Sage" from real neural voices, test on unseen voices)
        shell: pwsh
        timeout-minutes: 25
        env:
          PYTHONIOENCODING: utf-8
        run: python tests/windows_wake_check.py wake-check.json
      - name: Upload smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test
          path: |
            smoke.json
            smoke.png
            wake-check.json
            tabs-check.json
            online-check.json
            typing-check.json
            update-check.json
            window-check.json
            vision-check.json
            vision-check.png
            ${{ runner.temp }}/jarvis-home/jarvis.log
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-windows-x64
          path: dist/Jarvis.exe
          if-no-files-found: error
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Jarvis.exe

  release:
    name: Publish the update (GitHub release that JARVIS installs from)
    needs: [test-linux, build-windows]
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Jarvis-windows-x64
          path: dist
      - name: Write latest.json (version, size, SHA-256, notes)
        env:
          RUN_NUMBER: ${{ github.run_number }}
          REPO: ${{ github.repository }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: python3 tests/release_manifest.py dist/Jarvis.exe dist/latest.json dist/notes.md
      - name: Read the version
        id: v
        run: echo "version=$(python3 -c "import json; print(json.load(open('dist/latest.json'))['version'])")" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: J.A.R.V.I.S. ${{ steps.v.outputs.version }}
          body_path: dist/notes.md
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            dist/Jarvis.exe
            dist/latest.json
